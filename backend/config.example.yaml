# Webtoon2Video 全局配置模板
# 使用方式：cp config.example.yaml config.yaml 后按需修改。
# 未知键会直接报错（防止拼写错误被静默忽略）。

workspace:
  # 多部漫画的隔离工作区根目录（每部漫画一个子目录）
  root: ./workspace

api:
  # 阿里云百炼 OpenAI 兼容模式
  base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
  # API Key 从该环境变量读取，不落在配置文件里
  api_key_env: DASHSCOPE_API_KEY
  timeout_s: 180.0
  max_retries: 3
  retry_backoff_s: 1.0
  # Patch v3.4 Patch 16：MiniMax Speech 2.8 独立于百炼的一套凭据
  # （Key 放在项目根 .env 的 MINIMAX_API_KEY 里，不落在本文件）
  minimax_base_url: https://api.minimaxi.com/v1
  minimax_api_key_env: MINIMAX_API_KEY
  # 新版 Platform API Key 不需要 GroupId，留空即可
  minimax_group_id_env: MINIMAX_GROUP_ID
  minimax_group_id: ""
  # Patch v4.3：MiniMax t2a_v2 每分钟请求上限（RPM）。超限会返回
  # 1002 rate limit exceeded(RPM)，该句就没有音频 → 成片缺句。
  # 实测单账号约 17~30 次/分钟即触发，这里留余量；填 0 = 不限流。
  minimax_rate_limit_rpm: 20
  # Patch v4.3：同一 client 的在途请求上限。MiniMax 对并发极敏感
  # （多条在途会 1002 / 断连），1 = 串行；2 以上要非常保守。
  minimax_max_concurrency: 1

models:
  # Stage 3 识图（密集文字可用 qwen-vl-max）
  vision: qwen3-vl-plus
  # Stage 4B 拆拍配图（快、便宜、JSON 稳定）
  # 可选：deepseek-v4.1-flash-1017（百炼 · DeepSeek 高性价比，需先在百炼控制台开通权限）
  script: qwen3.7-plus
  # Stage 4A 故事编剧（说书体正文，最吃文笔与逻辑；留空则回退到 script）
  # 可选：deepseek-v4.1-flash-1017（百炼 · DeepSeek 高性价比，需先在百炼控制台开通权限）
  story_model: qwen4-max
  # Stage 5 配音。可选值：
  #   百炼：  qwen3-tts-flash / qwen-audio-3.1-tts-plus
  #   MiniMax：speech-2.8-hd（高质量）/ speech-2.8-turbo（快速）
  #   Edge：   edge-tts
  # 切到 MiniMax 后，下面的百炼音色（Elias/Cherry…）会被自动替换成
  # 同角色定位的 MiniMax 音色，不会再报 2013 invalid voice_id。
  tts: qwen3-tts-flash

video:
  # v2.4 锁定：仅输出 9:16 竖屏
  aspect_ratio: "9:16"
  width: 1080
  height: 1920
  fps: 30

render:
  ffmpeg_bin: ffmpeg
  background_blur: 40
  background_darken: 0.55
  # Patch 14：BGM 先 loudnorm 响度归一（I=-16:TP=-1.5:LRA=11）再降增益，
  # -11.5dB 叠加侧链闪避后仍能听见；旧值 -18dB 实测会被压到 -45dB 以下
  # Patch 18：侧链阈值放宽后 BGM 不再被压死，再抬到 -8.0dB
  bgm_gain_db: -8.0
  # 没有显式 BGM 时，自动挂载 assets/bgm/ 下的默认氛围音乐
  auto_bgm: true
  # 默认氛围音乐名（对应 assets/bgm/{default_bgm}.*）
  default_bgm: suspense
  # 是否把时间轴里的音效事件（sfx_events）混进音轨
  enable_sfx: true
  # 音效相对人声的增益（dB）；Patch 14 起混入前先做 dynaudnorm 峰值归一
  # Patch 18：抬到 -2.0dB，让扇耳光 / 摔碎这类关键音效听得见
  sfx_gain_db: -2.0

tts:
  # 主旁白音色（百炼系统音色 ID；切到 MiniMax 后会被自动换成 MiniMax 旁白音色）
  default_voice: Elias
  # 角色 → 音色映射；键是解说句里的 speaker_role
  # 作品级 series_config.yaml 的 voice_cast 可覆盖同名角色
  voice_cast:
    narrator: Elias
    male_lead: Ethan
    male_antagonist: Ryan
    female_lead: Cherry
    female_mature: Katerina
    male: Ethan
    female: Cherry
  # 讲解者（旁白）的音色与语速；作品级 series_config.yaml 的 tts 段可逐项覆盖
  narrator:
    voice: Elias
    speed: 1.18
  # 未识别角色的通用男声
  default_male:
    voice: Ethan
    speed: 1.15
  # 未识别角色的通用女声
  default_female:
    voice: Cherry
    speed: 1.15
  # 已识别角色的专属音色（键是角色名，如「继母」）；作品级可逐角色覆盖
  character_voices: {}
  #   继母:
  #     voice: Katerina
  #     speed: 1.05
  # Patch v4.3：合成失败的 beat 额外串行补齐几轮（限流时靠它把缺的句子补回来）；0 = 不补齐。
  retry_failed_rounds: 1
  # Patch v4.3：补齐仍失败时，是否用等长静音占位保住时间轴与字幕（问题会写进
  # 05_audio/audio_issues.json，不会静默吞掉）。false = 失败句不进音频清单（默认）。
  silence_placeholder_on_failure: false

concurrency:
  # 跨作品并发度
  series: 8
  # 单作品内 Stage 1~3 并发度（Stage 4 始终按 episode_no 串行加锁）
  stage: 6

# 全局多音字/同音字纠偏词典（作品级 series_config.yaml 可覆盖同名条目）
# 仅作用于 tts_text / spoken_text，严禁改写 narration_text（屏幕 ASS 字幕）
pronunciation_overrides: {}
