# Webtoon2Video 全局配置模板
# 使用方式：cp config.example.yaml config.yaml 后按需修改。
# 未知键会直接报错（防止拼写错误被静默忽略）。

workspace:
  # 多部漫画的隔离工作区根目录（每部漫画一个子目录）
  root: ./workspace

api:
  # 阿里云百炼 OpenAI 兼容模式
  base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
  # API Key 从该环境变量读取，不落在配置文件里
  api_key_env: DASHSCOPE_API_KEY
  timeout_s: 180.0
  max_retries: 3
  retry_backoff_s: 1.0

models:
  # Stage 3 识图（密集文字可用 qwen-vl-max）
  vision: qwen3-vl-plus
  # Stage 4B 拆拍配图（快、便宜、JSON 稳定）
  script: qwen-plus
  # Stage 4A 故事编剧（说书体正文，最吃文笔与逻辑；留空则回退到 script）
  story_model: qwen3.8-max
  # Stage 5 配音
  tts: qwen3-tts-flash

video:
  # v2.4 锁定：仅输出 9:16 竖屏
  aspect_ratio: "9:16"
  width: 1080
  height: 1920
  fps: 30

render:
  ffmpeg_bin: ffmpeg
  background_blur: 40
  background_darken: 0.55
  bgm_gain_db: -18.0
  # 没有显式 BGM 时，自动挂载 assets/bgm/ 下的默认氛围音乐
  auto_bgm: true
  # 默认氛围音乐名（对应 assets/bgm/{default_bgm}.*）
  default_bgm: suspense
  # 是否把时间轴里的音效事件（sfx_events）混进音轨
  enable_sfx: true
  # 音效相对人声的增益（dB）
  sfx_gain_db: -10.0

tts:
  # 主旁白音色（百炼系统音色 ID）
  default_voice: Elias
  # 角色 → 音色映射；键是解说句里的 speaker_role
  # 作品级 series_config.yaml 的 voice_cast 可覆盖同名角色
  voice_cast:
    narrator: Elias
    male_lead: Ethan
    male_antagonist: Ryan
    female_lead: Cherry
    female_mature: Katerina
    male: Ethan
    female: Cherry

concurrency:
  # 跨作品并发度
  series: 8
  # 单作品内 Stage 1~3 并发度（Stage 4 始终按 episode_no 串行加锁）
  stage: 6

# 全局多音字/同音字纠偏词典（作品级 series_config.yaml 可覆盖同名条目）
# 仅作用于 tts_text / spoken_text，严禁改写 narration_text（屏幕 ASS 字幕）
pronunciation_overrides: {}
